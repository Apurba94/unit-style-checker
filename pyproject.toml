[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-style-checker"
version = "0.1.0"
description = "Detect inconsistent number-unit formatting (5mg vs 5 mg, % spacing) in scientific text."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
unit-style-checker = "unit_style_checker.cli:main"

[tool.setuptools]
packages = ["unit_style_checker"]
